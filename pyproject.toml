[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipemixer"
version = "0.3.0"
description = "MIDI-controlled per-app volume mixer for Linux/PipeWire"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "python-rtmidi>=1.5",
]

[project.scripts]
pipemixer = "pipemixer.main:main"

[tool.setuptools]
packages = ["pipemixer", "pipemixer.audio", "pipemixer.midi", "pipemixer.system", "pipemixer.config", "pipemixer.ui"]
