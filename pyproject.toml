[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipemixer"
version = "0.5.0"
description = "MIDI-controlled per-app volume mixer for Linux/PipeWire"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "python-rtmidi>=1.5",
    "pulsectl>=22.3",
    "psutil>=5.9",
]

[project.scripts]
pipemixer = "pipemixer.main:main"

[tool.setuptools]
packages = ["pipemixer", "pipemixer.audio", "pipemixer.midi", "pipemixer.system", "pipemixer.config", "pipemixer.ui"]
